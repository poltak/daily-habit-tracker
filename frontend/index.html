<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A quiet, personal daily mood and activity journal."
    />
    <meta
      name="theme-color"
      content="#f7f3ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f0e17"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Sets the theme before the first paint. Keep it the same as BrowserThemeService and the key of SettingsStorage. -->
    <script>
      (function () {
        var root = document.documentElement;
        var media =
          typeof window.matchMedia === "function"
            ? window.matchMedia("(prefers-color-scheme: dark)")
            : { matches: false };
        function readPreference() {
          try {
            var value = window.localStorage.getItem("daymark-theme");
            return value === "light" || value === "dark" || value === "system"
              ? value
              : "system";
          } catch (_) {
            return "system";
          }
        }
        function apply() {
          var preference = readPreference();
          root.dataset.theme =
            preference === "system"
              ? media.matches
                ? "dark"
                : "light"
              : preference;
        }
        try {
          apply();
          if (typeof media.addEventListener === "function")
            media.addEventListener("change", apply);
          else if (typeof media.addListener === "function")
            media.addListener(apply);
        } catch (_) {
          root.dataset.theme = media.matches ? "dark" : "light";
        }
      })();
    </script>
    <title>%APP_NAME%</title>
    <link rel="icon" href="/favicon.svg" />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
